# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy with: New + -> Blueprint (or push this file, then connect the repo)
services:
  - type: web
    name: abra-news-api
    runtime: python
    rootDir: abra-news-api
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
